name: DevSecOps FocusAI Backend Security Review & Audit Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  semgrep-sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST Security Analysis
        uses: semgrep/semgrep-action@v1
        with:
          config: p/ci
        continue-on-error: true

  security-audit:
    name: FocusAI Backend Security Audit & SAST Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Security Suite Dependencies
        run: |
          cd FocusAIBackend
          npm install


      - name: Execute FocusAI Backend Security Suite Scanner
        env:
          NODE_PATH: ${{ github.workspace }}/FocusAIBackend/node_modules:${{ github.workspace }}/node_modules
        run: |
          node FocusAIBackend/scripts/generateSecuritySuite.js

      - name: Append Executive Summary & Findings to GHA Step Summary
        if: always()
        run: |
          if [ -f "FocusAIBackend/executive-summary.md" ]; then
            cat FocusAIBackend/executive-summary.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "FocusAIBackend/dependency-report.md" ]; then
            cat FocusAIBackend/dependency-report.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "FocusAIBackend/security-review.md" ]; then
            cat FocusAIBackend/security-review.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Enforce Zero-Critical Security Policy Gate
        run: |
          CRITICAL_COUNT=0
          if [ -f "FocusAIBackend/executive-summary.md" ]; then
            CRITICAL_LINES=$(grep -i "^\| Critical Findings" FocusAIBackend/executive-summary.md || true)
            CRITICAL_COUNT=$(echo "$CRITICAL_LINES" | grep -oE '\*\*[0-9]+\*\*' | grep -oE '[0-9]+' | head -n 1 || echo "0")
            CRITICAL_COUNT=${CRITICAL_COUNT:-0}
          fi
          echo "Critical Finding Count: $CRITICAL_COUNT"
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "::error::Zero-Critical Security Policy Violated! Found $CRITICAL_COUNT Critical vulnerability findings."
            exit 1
          else
            echo "✅ Zero-Critical Security Policy Enforced: 0 Critical findings detected."
          fi

      - name: Upload FocusAI Security Review Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focusai-backend-security-review-artifacts
          path: |
            FocusAIBackend/findings.xlsx
            FocusAIBackend/security-review.md
            FocusAIBackend/dependency-report.md
            FocusAIBackend/executive-summary.md
          retention-days: 30
