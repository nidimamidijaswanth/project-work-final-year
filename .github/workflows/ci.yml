name: FocusAI CI/CD - Build & Validation Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  backend-ci:
    name: Backend Build & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Verify Backend Server Code & Syntax
        run: |
          cd backend
          npm run build

  frontend-ci:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Build Production Frontend Bundle
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-build
          path: frontend/dist/
          retention-days: 7

  android-ci:
    name: Android App Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Capacitor Dependencies & Build Debug APK
        run: |
          rm -rf android/.gradle .gradle android/local.properties local.properties
          if [ -d "android" ]; then
            cd android
            npm install --no-audit --no-fund || true
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"
          fi

      - name: Upload Android Debug APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focusai-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
